name: Continuous Integration on master branch

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  SOURCE_ARTIFACT: ${{ github.workspace }}/source

jobs:
  create-source-distribution:
    name: Create Source Distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts/source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update APT and Install Required Packages
        run: |
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libtool \
            autotools-dev \
            automake \
            pkgconf \
            libssl-dev \
            libevent-dev \
            bsdmainutils \
            python3 \
            libboost-system-dev \
            libboost-filesystem-dev \
            libboost-chrono-dev \
            libboost-program-options-dev \
            libboost-test-dev \
            libboost-thread-dev \
            libboost-all-dev \
            libdb5.3-dev \
            libdb5.3++-dev \
            libminiupnpc-dev \
            libzmq3-dev \
            libqt5gui5 \
            libqt5core5a \
            libqt5dbus5 \
            qttools5-dev \
            qttools5-dev-tools \
            libprotobuf-dev \
            protobuf-compiler \
            libqrencode-dev

      - name: Create Distribution Tarball
        run: |
          ./autogen.sh
          ./configure --with-incompatible-bdb --with-miniupnpc CXXFLAGS="-std=c++11"
          make dist

      - name: Download Dependencies
        run: make -C depends download

      - name: Create Dependencies Tarball
        run: tar -czf depends.tar.gz depends

      - name: Prepare Files for Artifact
        run: |
          mkdir -p "$ARTIFACT_DIR"
          mv depends.tar.gz australiacash-*.tar.gz "$ARTIFACT_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: ${{ env.ARTIFACT_DIR }}

  build-linux:
    name: Build for Linux
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts/linux
      TEST_LOG_ARTIFACT_DIR: test-logs
    steps:
      - name: Getting Source
        uses: actions/download-artifact@v4
        with:
          name: source

      - name: Extract Archives
        run: |
          tar -xzf depends.tar.gz
          tar -xzf australiacash-*.tar.gz --strip-components=1

      - name: Install Required Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-zmq

      - name: Build Dependencies
        run: make -C depends -j$(nproc)

      - name: Build ACash
        run: |
          ./configure --prefix=$(realpath depends/x86_64-pc-linux-gnu) --disable-tests
          make -j$(nproc)

      - name: Prepare Files for Artifact
        run: |
          mkdir -p "$ARTIFACT_DIR"
          mv ./src/{australiacash-cli,australiacash-tx,australiacashd,qt/australiacash-qt} "$ARTIFACT_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: ${{ env.ARTIFACT_DIR }}

  build-windows:
    name: Build for Windows
    needs: create-source-distribution
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts/windows
    steps:
      - name: Getting Source
        uses: actions/download-artifact@v4
        with:
          name: source

      - name: Extract Archives
        run: |
          tar -xzf depends.tar.gz
          tar -xzf australiacash-*.tar.gz --strip-components=1

      - name: Install Required Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64

      - name: Switch MinGW GCC and G++ to POSIX Threading
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Build Dependencies
        run: make -C depends -j$(nproc) HOST=x86_64-w64-mingw32

      - name: Build ACash
        run: |
          ./configure --prefix=$(realpath depends/x86_64-w64-mingw32)
          make -j$(nproc)

      - name: Prepare Files for Artifact
        run: |
          mkdir -p "$ARTIFACT_DIR"
          mv ./src/{australiacash-cli.exe,australiacash-tx.exe,australiacashd.exe,qt/australiacash-qt.exe} "$ARTIFACT_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: ${{ env.ARTIFACT_DIR }}
